# OpenOCD config for Colorlight 5A-75B (Lattice ECP5 LFE5U-25F) over an FT232H.
#
# litex_boards ships prog/openocd_colorlight_5a_75b.cfg, which is the same file without
# the _CHIPNAME variable. LiteX's OpenOCD.get_tap_name() returns the literal string
# "$_CHIPNAME.tap", so a config that names its tap directly makes litex_server --jtag die
# with `can't read "_CHIPNAME": no such variable` after the TAP is already found.
#
# 0x0403:0x6014 is the FT232H, openFPGALoader's `ft232` cable. The low nibble of
# layout_init is the same 0x8/0xb MPSSE mapping; the upper bits drive ADBUS5..7, harmless
# only because nothing is wired to them.

adapter driver ftdi
adapter speed 25000
transport select jtag
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none

set _CHIPNAME ecp5
jtag newtap $_CHIPNAME tap -irlen 8 -expected-id 0x41111043
